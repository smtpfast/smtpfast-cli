name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Generated files match the spec snapshot
        run: |
          bun scripts/generate.ts --check
          bun scripts/sync-version.ts --check

      - name: Tests
        run: bun test

  node:
    name: npm build on Node ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Run the built CLI on Node
        run: node test/node-smoke.mjs

      - name: Check the package contents
        run: npm pack --dry-run

  binary:
    name: Standalone binary
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the linux-x64 binary
        run: bun scripts/build-binaries.ts linux-x64

      - name: Run it
        run: |
          ./dist-bin/smtpfast-linux-x64 --version
          ./dist-bin/smtpfast-linux-x64 commands --json --no-update-check > /dev/null
