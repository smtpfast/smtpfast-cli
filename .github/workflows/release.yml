name: Release

# Publishes one version: npm package with provenance, standalone binaries and
# a GitHub release. It runs when a v* tag is pushed by a person, and the spec
# sync workflow calls it directly, because a tag pushed with GITHUB_TOKEN does
# not start other workflows.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, like v0.2.0
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, like v0.2.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not a version tag like v1.2.3"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Type check and test
        run: |
          bun run typecheck
          bun scripts/generate.ts --check
          bun test

      - name: Build the npm package
        run: npm run build

      - name: Run the built CLI on Node
        run: node test/node-smoke.mjs

      - name: Build standalone binaries
        run: bun scripts/build-binaries.ts

      - name: Run the linux-x64 binary
        run: ./dist-bin/smtpfast-linux-x64 --version

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      # With a trusted publisher set up on npmjs.com, npm uses the workflow's
      # identity and NPM_TOKEN is not needed. Without one, it falls back to the token.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "smtpfast@$VERSION" version > /dev/null 2>&1; then
            echo "smtpfast@$VERSION is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Write release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "Install with \`npm install -g smtpfast@$VERSION\`, or download a binary below and check it against SHA256SUMS."
          } >> release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist-bin/* --clobber
          else
            gh release create "$TAG" dist-bin/* --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
